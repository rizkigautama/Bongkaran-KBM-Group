<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Login - Bongkaran</title>
    <!-- Memuat Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Memuat FontAwesome untuk Ikon (User & Gembok) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            background-color: #eef2f5; /* Warna latar belakang abu-abu terang */
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            border: none;
            border-radius: 4px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-top: 4px solid #28a745; /* Garis hijau di atas sesuai gambar */
        }
        .login-header {
            text-align: center;
            padding-bottom: 15px;
            border-bottom: 1px solid #ddd;
            margin-bottom: 20px;
        }
        .login-header img {
            max-width: 150px;
            margin-bottom: 10px;
        }
        .input-group-text {
            background-color: #e9ecef;
            border-left: 0;
        }
        .form-control {
            border-right: 0;
            background-color: #f8f9fa;
        }
        .form-control:focus {
            box-shadow: none;
            border-color: #ced4da;
            background-color: #fff;
        }
        .btn-masuk {
            background-color: #28a745;
            border-color: #28a745;
            font-weight: bold;
        }
        .btn-masuk:hover {
            background-color: #218838;
        }
        .footer-text {
            font-size: 0.85rem;
            color: #6c757d;
        }
        .footer-text a {
            text-decoration: none;
            color: #0d6efd;
        }
    </style>
</head>
<body>

    <div class="card login-card p-4">
        <!-- Bagian Header & Logo -->
        <div class="login-header">
            <!-- Ganti src ini dengan path logo aplikasi Bongkaran Anda -->
            <img src="https://via.placeholder.com/150x50?text=LOGO+BONGKARAN" alt="Logo Bongkaran">
            <h6 class="fw-bold mt-2 mb-0">BONGKARAN KBM GROUP</h6>
        </div>

        <h6 class="text-center mb-4 fw-bold">Halaman Login</h6>

        <!-- Form Login -->
        <form action="proses_login.php" method="POST">
            
            <!-- Input Email -->
            <div class="input-group mb-3">
                <input type="email" name="email" class="form-control" placeholder="email@domain.com" required>
                <span class="input-group-text"><i class="fas fa-user text-secondary"></i></span>
            </div>

            <!-- Input Password -->
            <div class="input-group mb-3">
                <input type="password" name="password" id="password" class="form-control" placeholder="••••••••" required>
                <span class="input-group-text"><i class="fas fa-lock text-secondary"></i></span>
            </div>

            <!-- Tampilkan Sandi & Lupa Sandi -->
            <div class="d-flex justify-content-between align-items-center mb-4" style="font-size: 0.9rem;">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="showPassword">
                    <label class="form-check-label text-secondary" for="showPassword">
                        Tampilkan kata sandi
                    </label>
                </div>
                <a href="#" class="text-decoration-none">Lupa Kata Sandi?</a>
            </div>

            <!-- Tombol Masuk -->
            <button type="submit" class="btn btn-masuk text-white w-100">Masuk</button>
        </form>

        <!-- Footer -->
        <div class="text-center mt-4 footer-text">
            Hak Cipta &copy; 2023 - 2024 Bongkaran.<br>
            <a href="#">Aplikasi Bongkaran v1.0</a>
        </div>
    </div>

    <!-- Script untuk fitur 'Tampilkan kata sandi' -->
    <script>
        document.getElementById('showPassword').addEventListener('change', function() {
            const passwordInput = document.getElementById('password');
            if (this.checked) {
                passwordInput.type = 'text';
            } else {
                passwordInput.type = 'password';
            }
        });
    </script>
</body>
</html>
