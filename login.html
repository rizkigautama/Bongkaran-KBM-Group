<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Login - Bongkaran</title>
    <!-- Memuat Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Memuat FontAwesome untuk Ikon (User & Gembok) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            background-color: #eef2f5; /* Warna latar belakang abu-abu terang */
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            border: none;
            border-radius: 4px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-top: 4px solid #28a745; /* Garis hijau di atas sesuai gambar */
        }
        .login-header {
            text-align: center;
            padding-bottom: 15px;
            border-bottom: 1px solid #ddd;
            margin-bottom: 20px;
        }
        .login-header img {
            max-width: 150px;
            margin-bottom: 10px;
        }
        /* Ikon berada di sebelah kiri input, background diganti warna putih agar menyatu dengan input */
        .input-group-text {
            background-color: #fff;
            border-right: 0;
            color: #6c757d; 
        }
        .form-control {
            border-left: 0;
            background-color: #fff;
        }
        /* Memberikan efek fokus saat input diklik */
        .input-group:focus-within .input-group-text,
        .input-group:focus-within .form-control {
             border-color: #86b7fe;
             box-shadow: none;
        }
        .btn-masuk {
            background-color: #28a745;
            border-color: #28a745;
            font-weight: bold;
        }
        .btn-masuk:hover {
            background-color: #218838;
        }
        .footer-text {
            font-size: 0.85rem;
            color: #6c757d;
        }
        .footer-text a {
            text-decoration: none;
            color: #0d6efd;
        }
    </style>
</head>
<body>

    <div class="card login-card p-4">
        <!-- Bagian Header & Logo -->
        <div class="login-header">
            <!-- Ganti src ini dengan path logo aplikasi Bongkaran Anda -->
            <img src="https://via.placeholder.com/150x50?text=LOGO+BONGKARAN" alt="Logo Bongkaran">
            <h6 class="fw-bold mt-2 mb-0">BONGKARAN KBM GROUP</h6>
        </div>

        <h6 class="text-center mb-4 fw-bold">Halaman Login</h6>

        <!-- Form Login (Action dihilangkan karena menggunakan JavaScript) -->
        <form id="loginForm">
            
            <!-- Input Email -->
            <div class="input-group mb-3">
                <span class="input-group-text"><i class="fas fa-user"></i></span>
                <input type="email" id="email" class="form-control" placeholder="email@domain.com" required>
            </div>

            <!-- Input Password -->
            <div class="input-group mb-3">
                <span class="input-group-text"><i class="fas fa-lock"></i></span>
                <input type="password" id="password" class="form-control" placeholder="••••••••" required>
            </div>

            <!-- Tampilkan Sandi & Lupa Sandi -->
            <div class="d-flex justify-content-between align-items-center mb-4" style="font-size: 0.9rem;">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="showPassword">
                    <label class="form-check-label text-secondary" for="showPassword">
                        Tampilkan kata sandi
                    </label>
                </div>
                <a href="#" class="text-decoration-none">Lupa Kata Sandi?</a>
            </div>

            <!-- Pesan Error (Tersembunyi secara default) -->
            <div id="errorMessage" class="alert alert-danger d-none p-2 mb-3 text-center" style="font-size: 0.9rem;" role="alert">
                Email atau Password salah!
            </div>

            <!-- Tombol Masuk -->
            <button type="submit" class="btn btn-masuk text-white w-100">Masuk</button>
        </form>

        <!-- Footer -->
        <div class="text-center mt-4 footer-text">
            Hak Cipta &copy; Rizki Gautama 2026 Bongkaran KBM.<br>
            <a href="#">Aplikasi Bongkaran v1.0</a>
        </div>
    </div>

    <!-- Script Logika -->
    <script>
        // 1. Fitur 'Tampilkan kata sandi'
        document.getElementById('showPassword').addEventListener('change', function() {
            const passwordInput = document.getElementById('password');
            if (this.checked) {
                passwordInput.type = 'text';
            } else {
                passwordInput.type = 'password';
            }
        });

        // 2. Logika Verifikasi Login
        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault(); // Mencegah form melakukan reload halaman

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');

            // --- KREDENSIAL LOGIN SEMENTARA ---
            // Ganti email dan password ini sesuai keinginan Anda
            const emailBenar = "admin@bongkaran.com";
            const passwordBenar = "admin123";

            if (email === emailBenar && password === passwordBenar) {
                // Sembunyikan pesan error jika sebelumnya muncul
                errorMessage.classList.add('d-none');
                
                // Simpan status login di Local Storage
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('userEmail', email);

                // Tampilkan notifikasi (opsional, bisa dihapus)
                alert('Login berhasil! Mengarahkan ke aplikasi...');
                
                // Alihkan (Redirect) ke halaman utama aplikasi (index.html)
                window.location.href = 'index.html'; 
            } else {
                // Tampilkan pesan error jika salah
                errorMessage.classList.remove('d-none');
            }
        });
    </script>
</body>
</html>
